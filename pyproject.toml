[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-knowledge-api"
version = "0.1.0"
description = "Read-only projection of generated document catalog metadata"
requires-python = ">=3.11"
dependencies = ["solo-empire-service-auth>=0.1.0,<0.2"]

[tool.setuptools]
py-modules = ["server", "knowledge_mcp"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "httpx>=0.27,<1"]  # knowledge-mcp (knowledge_mcp.py); not needed by the API image
dev = ["pytest>=8", "mcp>=2.3,<3", "httpx>=0.27,<1"]

[project.scripts]
knowledge-mcp = "knowledge_mcp:main"
